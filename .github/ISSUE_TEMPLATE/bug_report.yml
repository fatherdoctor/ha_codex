name: Bug report
description: Report a reproducible problem with Codex for Home Assistant.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please remove secrets, tokens, device codes, private URLs, and personal Home Assistant configuration before submitting.

  - type: input
    id: version
    attributes:
      label: Codex for Home Assistant version
      description: Give the app version and the integration version, or the commit if you built it yourself.
      placeholder: "Example: app 0.3.6, integration 0.3.6"
    validations:
      required: true

  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: "Example: 2026.5.4"
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Installation method
      options:
        - The app installed the integration (the default)
        - Integration installed from the Marketplace or HACS
        - Integration copied by hand
        - Other
    validations:
      required: true

  - type: dropdown
    id: affected_area
    attributes:
      label: Affected area
      options:
        - Worker app/add-on
        - Custom integration
        - Home Assistant actions/services
        - Config flow or setup
        - Entities or sensors
        - Ingress web UI
        - Codex sign-in
        - Task execution
        - Documentation
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - amd64
        - aarch64
        - Other
        - Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that trigger the issue.
      placeholder: |
        1. Go to ...
        2. Call action ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: failure_time
    attributes:
      label: When did it happen?
      description: Give the date and time of the failed interaction, with your time zone. The time shows which lines in the logs belong to the failure.
      placeholder: "Example: 2026-11-12 14:32 US Central"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Logs are the fastest way to get a bug fixed. Please include whichever of these apply, after removing sensitive information:

        - **Worker app log:** Settings, Apps, Codex for Home Assistant, Log tab. Copy the lines around the time of the failure.
        - **Integration diagnostics:** Settings, Devices & services, Codex, three-dot menu, Download diagnostics ([steps](https://github.com/fatherdoctor/ha_codex/blob/main/codex-cli-worker/DOCS.md#interaction-logs-for-a-bug-report)). Attach the downloaded file under Additional context below (this box takes text only). It holds anonymized details of the last interactions. Open the file and read all of it before you post it, and remove anything private; anonymizing is automatic, but you are the last check.
        - **Home Assistant Core log:** Settings, System, Logs. Type `codex` in the filter box and copy the matching lines.
      render: text

  - type: textarea
    id: extra_context
    attributes:
      label: Additional context
      description: Add screenshots, example YAML, or anything else that helps explain the issue.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I removed secrets, tokens, device codes, private URLs, and personal Home Assistant configuration.
          required: true
        - label: I checked the existing issues for a similar report.
          required: true
