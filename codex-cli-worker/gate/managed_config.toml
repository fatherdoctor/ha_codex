# Managed Codex configuration for this app (/etc/codex/managed_config.toml, read-only in the image).
# It names the command check that runs before every tool call and on every permission request,
# from every client. The check refuses or says nothing; it never asks.
#
# The hook table shape follows the Codex CLI 0.166.0 binary and is to be confirmed on a test
# machine before a release that allows remote control.

# The tool keys (HA_*_CAPABILITY) reach each tool through its own env_vars; a command Codex runs must
# not see them, or it could send a request to a tool's socket itself and skip Codex's question. The page
# launch and the relay launch set the same exclude, and this layer outranks both, and every setting a
# client sends with a thread (Codex 0.166.0, config/src/config_layer_source.rs, precedence 40 over 30).
[shell_environment_policy]
exclude = ["HA_*_CAPABILITY"]

[[hooks.PreToolUse]]
matcher = ".*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/usr/bin/python3 -I /usr/share/ha_codex/gate_hook.py --event PreToolUse"
timeout = 10

[[hooks.PermissionRequest]]
matcher = ".*"

[[hooks.PermissionRequest.hooks]]
type = "command"
command = "/usr/bin/python3 -I /usr/share/ha_codex/gate_hook.py --event PermissionRequest"
timeout = 10
