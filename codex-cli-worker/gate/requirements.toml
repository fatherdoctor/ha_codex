# Managed requirements for Codex in this app (/etc/codex/requirements.toml, read-only in the image).
# They hold for every client, the chat page and the ChatGPT app's remote control alike, and no
# file under /config or CODEX_HOME can loosen them.
#
# - No full-access sandbox, whatever a client asks for.
# - Only the hooks named in /etc/codex/managed_config.toml run, so a hook planted in /config or
#   CODEX_HOME cannot replace the command check.
#
# Codex 0.166.0 lab captures confirm these keys. Relay thread/start can warn and fall
# back to read-only for a disallowed setting; this policy does not promise an RPC error.
allowed_sandbox_modes = ["read-only", "workspace-write"]
allowed_approval_policies = ["on-request"]
allow_managed_hooks_only = true
