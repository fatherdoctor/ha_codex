# Managed requirements for Codex in this app (/etc/codex/requirements.toml; full_access.py writes it from this copy).
# They hold for every client, the chat page and the ChatGPT app's remote control alike, and no
# file under /config or CODEX_HOME can loosen them.
#
# - The values of the four permission modes (policy.MODES) and nothing else. The full-access sandbox
#   and the "never" approval policy are added only while the owner's Full access switch is on
#   (full_access.py writes this file at start and on each change).
# - The person answers permission requests, or Codex's own reviewer (Auto-review) where a client asks
#   for it. The person comes first, so a thread that names no reviewer asks the person.
# - No hooks: allow_managed_hooks_only with no managed hooks means a hook planted in /config or
#   CODEX_HOME never runs. A hook runs outside the sandbox, so this keeps the sandbox whole.
#
# Codex 0.166.0 lab captures confirm these keys. Relay thread/start can warn and fall
# back to read-only for a disallowed setting; this policy does not promise an RPC error.
allowed_sandbox_modes = ["read-only", "workspace-write"]
allowed_approval_policies = ["on-request"]
allowed_approvals_reviewers = ["user", "auto_review"]
allow_managed_hooks_only = true
