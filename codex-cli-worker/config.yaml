name: Codex for Home Assistant
description: Run Codex CLI tasks against the Home Assistant config folder.
version: "0.3.6"
slug: codex_cli_worker
url: https://github.com/fatherdoctor/ha_codex
image: ghcr.io/fatherdoctor/codex-cli-worker
init: false
startup: services
boot: auto
stdin: true
ingress: true
ingress_port: 9123
panel_icon: mdi:robot
apparmor: true
arch:
  - aarch64
  - amd64
map:
  - type: homeassistant_config
    read_only: false
    path: /config
  - type: addon_config
    read_only: false
    path: /addon_config
  - type: share
    read_only: false
homeassistant_api: true
hassio_api: true
backup_exclude:
  - "*/ha-docs*"
  - "*/ha-data*"
  - "*/.ssh"
  - "*/github"
  - "*/github.sock"
  - "*/chat_uploads"
discovery:
  - codex_cli
options:
  codex_model: default
  model_reasoning_effort: medium
  reasoning_summary: concise
  codex_sandbox: workspace-write
  task_timeout_seconds: 3600
  task_stall_seconds: 600
  auto_save_lovelace: true
  config_check: true
  full_snapshot: false
  backup_retention_days: 7
  chat_retention_days: 14
  browser_verification: true
  browser_memory_limit_mib: 1536
  local_docs: true
  warm_start: true
  ha_url: ""
  remote_control_name: Home Assistant
  install_integration: true
  home_assistant_mcp: true
schema:
  codex_model: str
  model_pin: str?
  model_reasoning_effort: str
  reasoning_summary: list(concise|detailed|none)
  codex_sandbox: list(workspace-write|read-only)
  notify_service: str?
  github_client_id: str?
  task_timeout_seconds: int
  task_stall_seconds: int(0,86400)
  auto_save_lovelace: bool
  config_check: bool
  full_snapshot: bool
  backup_retention_days: int(1,365)
  chat_retention_days: int(1,365)
  browser_verification: bool
  browser_memory_limit_mib: int(512,8192)
  local_docs: bool
  warm_start: bool
  ha_url: str?
  HA_TOKEN: password?
  remote_control_name: str?
  interactions_to_keep: int(10,100)?
  install_integration: bool
  home_assistant_mcp: bool
