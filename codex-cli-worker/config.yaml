name: Codex CLI Worker
description: Run Codex CLI tasks against the Home Assistant config folder.
version: "0.1.81.2"
slug: codex_cli_worker
url: https://github.com/fatherdoctor/ha_codex
image: ghcr.io/fatherdoctor/codex-cli-worker
init: false
startup: services
boot: auto
stdin: true
ingress: true
ingress_port: 9123
panel_icon: mdi:robot
apparmor: true
arch:
  - aarch64
  - amd64
map:
  - type: homeassistant_config
    read_only: false
    path: /config
homeassistant_api: true
backup_exclude:
  - "*/ha-docs*"
  - "*/ha-data*"
  - "*/.ssh"
discovery:
  - codex_cli
options:
  codex_model: default
  model_pin: gpt-6.1-sol
  model_reasoning_effort: medium
  reasoning_summary: concise
  codex_sandbox: workspace-write
  task_root: /config/codex_tasks
  task_timeout_seconds: 3600
  task_stall_seconds: 600
  auto_save_lovelace: true
  config_check: true
  full_snapshot: false
  backup_retention_days: 7
  browser_verification: true
  browser_memory_limit_mib: 1536
  local_docs: true
  ha_url: ""
  remote_control_name: Home Assistant
schema:
  codex_model: list(default|gpt-6-astra|gpt-6.1-sol|gpt-6.1-terra|gpt-6-sol|gpt-6-luna|gpt-5.6-sol|gpt-5.6-terra|gpt-5.6-luna|gpt-5.5)
  model_pin: str?
  model_reasoning_effort: list(minimal|low|medium|high|xhigh)
  reasoning_summary: list(concise|detailed|none)
  codex_sandbox: list(workspace-write|read-only)
  task_root: str
  notify_service: str?
  task_timeout_seconds: int
  task_stall_seconds: int(0,86400)
  auto_save_lovelace: bool
  config_check: bool
  full_snapshot: bool
  backup_retention_days: int(1,365)
  browser_verification: bool
  browser_memory_limit_mib: int(512,8192)
  local_docs: bool
  ha_url: str?
  HA_TOKEN: password?
  remote_control_name: str?
