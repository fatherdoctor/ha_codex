configuration:
  codex_model:
    name: Codex model
    description: Model passed to Codex CLI. Use default to let Codex CLI choose its recommended model, or select GPT-6 Astra, GPT-6.1 Sol, GPT-6.1 Terra, GPT-6 Sol, or GPT-6 Luna, or the older GPT-5.6 Sol, Terra, or Luna. gpt-5.5 is deprecated, do not select it. It is listed only so that existing setups keep starting, and it runs GPT-5.6 Sol. Model availability depends on your account. Legacy GPT-5.3-Codex selections are treated as default for upgrade compatibility.
  model_pin:
    name: Model pin
    description: The only model the assistant runs on. A chat or a saved conversation that asks for another model is stopped with an error instead of running on it, and the Codex model option must be default or this model. Set it to none to turn the pin off.
  model_reasoning_effort:
    name: Model reasoning effort
    description: Reasoning effort passed to Codex CLI for supported models. low is lighter; medium is balanced; high uses more reasoning; xhigh uses extra reasoning. minimal is not supported by the current models and runs medium.
  reasoning_summary:
    name: Reasoning summaries
    description: How much of its thinking Codex reports while it works. concise shows short headlines in the chat activity list, detailed asks for fuller summaries, and none hides reasoning from the list. Commands, file edits, searches, and progress notes are shown regardless.
  codex_sandbox:
    name: Codex sandbox
    description: workspace-write is the default and allows edits in /config; read-only allows inspection. Commands or file changes needing extra access ask a Home Assistant administrator for Allow once or Deny in the chat. There is no full-access mode in this fork.
  task_root:
    name: Task root
    description: Folder where prompts, logs, backups, status files, and change lists are saved. Keep it inside /config so Codex can save a copy of each file before changing it.
  notify_service:
    name: Notification service
    description: Optional Home Assistant notify service for task completion, failures, questions, and permission requests. Leave unset or blank to use persistent notifications. The app configuration page does not support Home Assistant service autocomplete, so this is a plain text field.
  task_timeout_seconds:
    name: Task timeout
    description: Maximum run time for one Codex task before the worker stops it.
  task_stall_seconds:
    name: Stall limit
    description: Stop a task when Codex sends nothing for this many seconds while no permission request is waiting, for example after a network drop. A command that prints nothing for this long counts too. 0 turns the check off.
  auto_save_lovelace:
    name: Auto-save Lovelace dashboards
    description: After Codex edits storage-mode Lovelace files, save changed dashboards through the Home Assistant WebSocket API so the UI updates in memory.
  config_check:
    name: Home Assistant configuration check
    description: After a task changes YAML files, ask Home Assistant to check its configuration, as Developer Tools does. A failing check marks the task as failed and points to the saved previous version of the affected files. Turn off to skip the check on slow systems.
  full_snapshot:
    name: Full snapshot before every message
    description: Also archive the whole configuration folder before every message. Codex still saves a copy of each file before changing it, and the archive supplies the previous version of any file it did not copy. Off by default. On a large configuration this adds a wait before every message and uses a lot of disk space.
  backup_retention_days:
    name: Keep backups for (days)
    description: How many days after an exchange its backups are kept, from 1 to 365. Applies to the copies Codex saves before changing a file and to full snapshots. Default is 7 days.
  ha_url:
    name: Core API URL override
    description: Leave empty to discover Core's port and SSL setting from Supervisor at startup and each task or remote-control launch. An explicit HTTP(S) override is passed as HA_URL even without HA_TOKEN. Saved values equal to the old default are treated as unset. This address supplies no credentials; remote entity reads use the worker's read-only tool without a hand-made token. The app's own authenticated calls keep using its Supervisor proxy.
  browser_verification:
    name: Enable built-in browser
    description: Allow dashboard inspection and desktop/mobile screenshots. The browser uses RAM while it runs; set its budget with Browser memory limit below. Turn this off to completely disable browser launches and screenshots if you do not need them or your system has limited RAM. State and configuration checks remain available. No Home Assistant password or manually created token is needed.
  browser_memory_limit_mib:
    name: Browser memory limit (MiB)
    description: Memory budget for dashboard screenshots, from 512 to 8192 MiB. Default is 1536 MiB (1.5 GiB). Increase it for larger dashboards if your system has enough free memory for Home Assistant and other apps. This sets a limit for browser captures; it does not reserve RAM or limit the whole app.
  local_docs:
    name: Local Home Assistant documentation
    description: Download the official Home Assistant documentation from GitHub into private app storage, about 25 MB, so Codex can search it directly instead of searching the web for documentation. The copy is fetched in the background when the app first starts and again after each Home Assistant update. Turn this off to stop the downloads; Codex then uses web search as before.
  HA_TOKEN:
    name: HA_TOKEN
    description: Optional Home Assistant token exposed to Codex subprocesses as the HA_TOKEN environment variable, together with HA_URL, the address above. Codex can then call Home Assistant's API with the rights of the token's user, for example to reload automations or restart Home Assistant.
  remote_control_name:
    name: Remote control machine name
    description: The name this Home Assistant shows in the ChatGPT app when remote control is on. The default is Home Assistant. Letters, digits, spaces, dots, dashes and underscores are kept, up to 63 characters; if the name cannot be used as written, Home-Assistant is used instead. Remote control itself is turned on and off in the app's Settings page, not here. Change the name while remote control is off.
