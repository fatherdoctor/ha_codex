configuration:
  codex_model:
    name: Codex model
    description: Model passed to Codex CLI. Use default to let Codex CLI choose its recommended model, or select GPT-6 Astra, GPT-6.1 Sol, GPT-6.1 Terra, GPT-6 Sol, or GPT-6 Luna, or the older GPT-5.6 Sol, Terra, or Luna. gpt-5.5 is deprecated, do not select it. It is listed only so that existing setups keep starting, and it runs GPT-5.6 Sol. Model availability depends on your account. Legacy GPT-5.3-Codex selections are treated as default for upgrade compatibility.
  model_pin:
    name: Model pin
    description: Leave empty to use your account's default model. Set it to make this the only model the assistant runs on. A chat or a saved conversation that asks for another model is stopped with an error instead of running on it, and the Codex model option must be default or this model. Clear it to turn the pin off.
  model_reasoning_effort:
    name: Model reasoning effort
    description: Reasoning effort passed to Codex CLI for supported models. low is lighter; medium is balanced; high uses more reasoning; xhigh uses extra reasoning. minimal is not supported by the current models and runs medium.
  reasoning_summary:
    name: Reasoning summaries
    description: How much of its thinking Codex reports while it works. concise shows short headlines in the chat activity list, detailed asks for fuller summaries, and none hides reasoning from the list. Commands, file edits, searches, and progress notes are shown regardless.
  codex_sandbox:
    name: Codex sandbox
    description: workspace-write is the default and allows edits in /config; read-only allows inspection. Commands or file changes needing extra access ask a Home Assistant administrator for Allow once or Deny in the chat. This option has no full-access value. A chat can run without the sandbox only in the Full access permission mode, which is off until an administrator turns it on in the app's Settings page.
  task_root:
    name: Task root
    description: Folder where prompts, logs, backups, status files, and change lists are saved. Keep it inside /config so Codex can save a copy of each file before changing it.
  notify_service:
    name: Notification service
    description: Optional Home Assistant notify service for questions, permission requests and failures. Leave unset or blank to use persistent notifications. The app configuration page does not support Home Assistant service autocomplete, so this is a plain text field.
  github_client_id:
    name: GitHub App client ID
    description: Public client ID used for GitHub sign-in. The default uses The Backshop GitHub App. Change this only if you use your own GitHub App. The client ID is not a secret.
  task_timeout_seconds:
    name: Task timeout
    description: The longest one message may run, in seconds, before the worker stops it. The default is 3600, one hour. Time spent waiting for your answer to a permission request counts.
  task_stall_seconds:
    name: Stall limit
    description: Stop a task when Codex sends nothing for this many seconds while no permission request is waiting, for example after a network drop. A command that prints nothing for this long counts too. 0 turns the check off.
  auto_save_lovelace:
    name: Auto-save Lovelace dashboards
    description: After Codex edits storage-mode Lovelace files, save changed dashboards through the Home Assistant WebSocket API so the UI updates in memory.
  config_check:
    name: Home Assistant configuration check
    description: After a task changes YAML files, ask Home Assistant to check its configuration, as Developer Tools does. A failing check marks the task as failed and points to the saved previous version of the affected files. Turn off to skip the check on slow systems.
  full_snapshot:
    name: Full snapshot before every message
    description: Also archive the tracked files of the configuration folder before every message. Codex is still told to save a copy of each file before changing it, and the archive can supply the previous version of a tracked file that it did not copy. It is not a complete backup - credential files, files larger than 8 MiB, databases, logs and media folders are left out. Off by default. On a large configuration this adds a wait before every message and uses a lot of disk space.
  backup_retention_days:
    name: Keep backups for (days)
    description: How many days after an exchange its backups are kept, from 1 to 365. Applies to the copies Codex saves before changing a file and to full snapshots. Default is 7 days.
  ha_url:
    name: Home Assistant API URL
    description: Address that Codex uses for its own Home Assistant API calls when HA_TOKEN is set. It is passed to Codex as the HA_URL environment variable. The default, http://homeassistant:8123, is Home Assistant's own address inside the app network; change it only if your Home Assistant uses HTTPS or another port. The earlier default, http://supervisor/core, does not accept a Home Assistant token and is treated as the default. The app's own calls do not use this address. From 0.1.81.2, leave the override empty to discover Core's actual port and SSL setting on each launch. Saved legacy defaults are treated as unset; an explicit HTTP(S) override wins. With SSL, use the certificate hostname and keep TLS verification enabled.
  browser_verification:
    name: Enable built-in browser
    description: Allow dashboard inspection and desktop/mobile screenshots. The browser uses RAM while it runs; set its budget with Browser memory limit below. Turn this off to completely disable browser launches and screenshots if you do not need them or your system has limited RAM. State and configuration checks remain available. No Home Assistant password or manually created token is needed.
  browser_memory_limit_mib:
    name: Browser memory limit (MiB)
    description: Memory budget for dashboard screenshots, from 512 to 8192 MiB. Default is 1536 MiB (1.5 GiB). Increase it for larger dashboards if your system has enough free memory for Home Assistant and other apps. This sets a limit for browser captures; it does not reserve RAM or limit the whole app.
  local_docs:
    name: Local Home Assistant documentation
    description: Download the official Home Assistant documentation from GitHub into private app storage, about 25 MB, so Codex can search it directly instead of searching the web for documentation. The copy is fetched in the background when the app first starts and again after each Home Assistant update. Turn this off to stop the downloads; Codex then uses web search as before.
  HA_TOKEN:
    name: HA_TOKEN
    description: Optional Home Assistant token exposed to Codex subprocesses as the HA_TOKEN environment variable, together with HA_URL, the address above. Codex can then call Home Assistant's API with the rights of the token's user, for example to reload automations or restart Home Assistant.
  remote_control_name:
    name: Remote control machine name
    description: The name this Home Assistant shows in the ChatGPT app when remote control is on. The default is Home Assistant. Letters, digits, spaces, dots, dashes and underscores are kept, up to 63 characters; if the name cannot be used as written, Home-Assistant is used instead. Remote control itself is turned on and off in the app's Settings page, not here. A new name takes effect when the app restarts; if the ChatGPT app still shows the old name, choose New pairing code in Settings.
  interactions_to_keep:
    name: Interactions to keep
    description: How many recent interactions the app keeps for the integration's Download diagnostics, from 10 to 100. Leave it empty to keep the number you have, 25 on a new install. Lower numbers remove the oldest records first.
  install_integration:
    name: Install the Codex integration
    description: On each start, install or update the Codex integration in /config/custom_components/codex_cli from the copy in this app, so the two always have the same version. After the app writes the folder, a notification asks you to restart Home Assistant. A folder installed another way (Marketplace, HACS or by hand), or changed after the app wrote it, is never changed. Turn this off to install and update the integration yourself. Uninstalling the app does not remove the integration.
  home_assistant_mcp:
    name: Enable Home Assistant MCP
    description: Give Codex the tools of the bundled Home Assistant MCP server (hass-mcp 0.6.0), in chats, scheduled runs and under remote control. Codex can then find entities, areas, automations, dashboards, history, statistics and the error log without a search through files, and uses these read tools without asking. They show what Home Assistant returns, including attributes such as camera picture links, which hold a short-lived access token. Codex asks you before each tool call that changes the house or a dashboard. Turn this off to remove the tools.
