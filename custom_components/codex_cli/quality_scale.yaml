rules:
  action-setup:
    status: todo
    comment: Actions must reject entries that are setting up, retrying or unloading.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: todo
    comment: Document the default and existing-session behavior of start_login.force.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: done
    comment: CoordinatorEntity owns entity subscriptions; entry callbacks have unload cleanup.
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: todo
    comment: The browser-session broker must move from hass.data into typed entry runtime data.
  test-before-configure: done
  test-before-setup:
    status: todo
    comment: Discovery must preserve authentication rejection so setup can request reauthentication.
  unique-config-entry: done

  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner:
    status: done
    comment: The integration manifest lists its code owner.
  log-when-unavailable: done
  parallel-updates:
    status: done
    comment: Both entity platforms explicitly set PARALLEL_UPDATES to zero for their shared coordinator.
  reauthentication-flow:
    status: todo
    comment: The reauth flow exists, but initial discovery authentication failures must trigger it.

  devices: done
  diagnostics: done
  discovery:
    status: done
    comment: The Supervisor flow discovers the worker app.
  discovery-update-info:
    status: todo
    comment: Rediscovery aborts a duplicate before updating its connection metadata.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: The integration represents one configured local worker.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: The integration exposes only a small set of diagnostic entities.
  entity-translations: done
  stale-devices:
    status: exempt
    comment: The integration represents one configured local worker device.

  async-dependency: done
  inject-websession: done

  config-flow-test-coverage: done
  test-coverage:
    status: todo
    comment: Add full pytest coverage before considering a Core-quality submission.
  exception-translations:
    status: todo
    comment: Service action exceptions are functional but not translated yet.
  icon-translations:
    status: todo
    comment: Entities use static icons; icon translations have not been added.
  reconfiguration-flow: done
  repair-issues: done
  strict-typing:
    status: todo
    comment: Type annotations are present for integration code, but strict mypy coverage is not configured.
