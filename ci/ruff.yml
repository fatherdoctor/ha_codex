name: Format and imports

# One formatter and one import order for the Python in this repository (ruff.toml). The job fails on
# a file that `ruff format` would change, on a statement list joined by a semicolon (E702) and on
# unsorted imports (I001). The other rules in ruff.toml are not enforced yet.

on:
  pull_request:
    branches:
      - main
      - release/**

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff format, E702 and I001
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install ruff
        run: pip install ruff==0.17.4
      - name: Format check
        run: ruff format --check .
      - name: Semicolons and import order
        run: ruff check --select E702,I001 .
